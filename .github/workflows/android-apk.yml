name: Build Android APK (TWA)

# Wraps the deployed PWA in a Trusted Web Activity and produces an installable
# APK plus a Play-Store AAB. Run it manually once the app is reachable over
# HTTPS — a TWA loads the live site, so there is nothing to build until then.

on:
  workflow_dispatch:
    inputs:
      host:
        description: 'Public HTTPS host serving ProjectNotes (e.g. notes.example.com)'
        required: true
      version_name:
        description: 'Version name shown to users'
        required: false
        default: '1.0.0'
      version_code:
        description: 'Integer version code (must increase on every Play upload)'
        required: false
        default: '1'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Point the manifest at the deployed host
        run: |
          sed -i "s|REPLACE_WITH_YOUR_DOMAIN|${{ github.event.inputs.host }}|g" android/twa-manifest.json
          sed -i "s|\"appVersionName\": \"[^\"]*\"|\"appVersionName\": \"${{ github.event.inputs.version_name }}\"|" android/twa-manifest.json
          sed -i "s|\"appVersionCode\": [0-9]*|\"appVersionCode\": ${{ github.event.inputs.version_code }}|" android/twa-manifest.json
          cat android/twa-manifest.json

      - name: Restore the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Set the ANDROID_KEYSTORE_BASE64 secret (base64 of your .keystore file)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/android.keystore

      - name: Build APK and AAB
        working-directory: android
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          bubblewrap init --manifest "https://${{ github.event.inputs.host }}/manifest.webmanifest" --directory . || true
          bubblewrap build --skipPwaValidation

      - uses: actions/upload-artifact@v4
        with:
          name: projectnotes-android
          path: |
            android/app-release-signed.apk
            android/app-release-bundle.aab
          if-no-files-found: error

      - name: Remind about Digital Asset Links
        run: |
          echo "Serve the assetlinks.json printed by Bubblewrap at"
          echo "  https://${{ github.event.inputs.host }}/.well-known/assetlinks.json"
          echo "or Android will show the browser address bar instead of a full-screen app."
