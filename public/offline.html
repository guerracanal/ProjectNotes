<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sin conexión · ProjectNotes</title>
    <link rel="icon" href="/icons/favicon-32.png" />
    <style>
      :root {
        color-scheme: dark light;
        --bg: #0a0b12;
        --surface: #14161f;
        --text: #f2f4fb;
        --muted: #a4abc2;
        --accent: #818cf8;
        --border: #262a38;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f6f7fb;
          --surface: #ffffff;
          --text: #14162b;
          --muted: #5a6076;
          --accent: #4f46e5;
          --border: #e2e5ef;
        }
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        line-height: 1.6;
      }
      .card {
        max-width: 420px;
        padding: 40px 32px;
        text-align: center;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 20px;
      }
      .mark {
        width: 60px;
        height: 60px;
        margin: 0 auto 20px;
        display: grid;
        place-items: center;
        border-radius: 16px;
        background: linear-gradient(135deg, #6366f1, #4338ca);
      }
      h1 { font-size: 1.35rem; margin-bottom: 10px; letter-spacing: -0.02em; }
      p { color: var(--muted); font-size: 0.95rem; margin-bottom: 24px; }
      button {
        padding: 11px 22px;
        border: none;
        border-radius: 10px;
        background: var(--accent);
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover { filter: brightness(1.1); }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="m12 3 9 5-9 5-9-5z" />
          <path d="m3 13 9 5 9-5" />
        </svg>
      </div>
      <h1>Sin conexión</h1>
      <p>
        ProjectNotes lee tus proyectos desde el servidor local. Vuelve a conectarte
        para seguir consultando tus notas, tareas y transcripciones.
      </p>
      <button onclick="location.reload()">Reintentar</button>
    </div>
  </body>
</html>
